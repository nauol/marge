name: Mettre en ligne Horclean
on:
  push:
    branches: [claude/relaxed-babbage-vig6yt]
    paths: ["sites/horclean/**", ".github/workflows/horclean.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer les fichiers publics
        run: mkdir dist && cp sites/horclean/index.html sites/horclean/share.jpg sites/horclean/google*.html sites/horclean/sitemap.xml sites/horclean/robots.txt dist/
      - name: Envoyer sur Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 75accf69319d29822753587d540c97c4
        run: npx -y wrangler@3.114.0 pages deploy dist --project-name horclean --branch main --commit-dirty=true
